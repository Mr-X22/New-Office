<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Carpeta — Suite ofimática ligera</title>
<meta name="description" content="Procesador de texto, hoja de cálculo y presentaciones, pensados para equipos con pocos recursos.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main id="launcher" class="launcher">
    <header class="launcher__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <rect x="2" y="4" width="30" height="26" rx="3" fill="#1F3A5F"/>
            <rect x="2" y="4" width="30" height="7" rx="3" fill="#16283F"/>
            <circle cx="8" cy="7.5" r="1.4" fill="#F2EEE4"/>
            <circle cx="12.5" cy="7.5" r="1.4" fill="#F2EEE4"/>
          </svg>
        </span>
        <div>
          <h1>Carpeta</h1>
          <p class="brand__tagline">Tu suite ofimática, sin pedirle demasiado a tu equipo.</p>
        </div>
      </div>
    </header>

    <section class="tabs" aria-label="Aplicaciones disponibles">
      <button class="tab tab--word" data-open-module="word">
        <span class="tab__icon" aria-hidden="true">A</span>
        <span class="tab__label">Documentos</span>
        <span class="tab__hint">Escritos, cartas, reportes</span>
      </button>
      <button class="tab tab--sheet" data-open-module="sheet">
        <span class="tab__icon" aria-hidden="true">▦</span>
        <span class="tab__label">Hojas de cálculo</span>
        <span class="tab__hint">Listas, cuentas, tablas</span>
      </button>
      <button class="tab tab--slides" data-open-module="slides">
        <span class="tab__icon" aria-hidden="true">▤</span>
        <span class="tab__label">Presentaciones</span>
        <span class="tab__hint">Diapositivas para exponer</span>
      </button>
    </section>

    <footer class="launcher__footer">
      <p>Abre y guarda archivos .docx, .xlsx y .pptx directamente en tu equipo. No se sube nada a internet.</p>
    </footer>
  </main>

  <div id="app-root" class="app-root" hidden aria-busy="false">
    <button id="back-to-launcher" class="visually-hidden-trigger" hidden></button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
